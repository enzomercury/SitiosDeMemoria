<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuito de Memoria · Ciudad de Artigas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@600;700&display=swap">
<style>
/* Concepto: mapa a pantalla completa con lista lateral; cada sitio es un número sobre el mapa y abre una ficha. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#14213d; --muted:#5b6578; --line:#d9dee7;
  --c-detencion:#0b4aa8;   /* Centros y lugares de detención, tortura y cárceles */
  --c-resistencia:#00899f; /* Lugares de resistencia */
  --c-homenaje:#1e7bff;    /* Homenajes */
  --focus:#14213d;
  --font-head:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --panel:#161e2d; --fg:#e8edf6; --muted:#9aa6bc; --line:#2a3548;
    --c-detencion:#5f9bff; --c-resistencia:#2cc3dc; --c-homenaje:#6fb0ff; --focus:#e8edf6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1420; --panel:#161e2d; --fg:#e8edf6; --muted:#9aa6bc; --line:#2a3548;
  --c-detencion:#5f9bff; --c-resistencia:#2cc3dc; --c-homenaje:#6fb0ff; --focus:#e8edf6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:380px minmax(0,1fr);height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.head h1{font:700 30px/1.05 var(--font-head);margin:0 0 6px;letter-spacing:.2px;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:13.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="true"]{border-color:currentColor}
.list{overflow:auto;flex:1;min-height:0;padding:6px 0 12px}
.group{padding:12px 20px 4px;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-left:4px solid transparent;padding:9px 20px;cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.item[aria-current="true"]{background:color-mix(in srgb,var(--fg) 9%,transparent);border-left-color:var(--fg)}
.item b{font-weight:500;line-height:1.3;display:block}
.item small{color:var(--muted);display:block}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 14px var(--font-head);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.k-detencion{background:#0b4aa8}.k-resistencia{background:#00899f}.k-homenaje{background:#1e7bff}
:root[data-theme="dark"] .num,:root:not([data-theme="light"]) .num{border-color:#0e1420}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .num{border-color:#fff}}
.tools{padding:10px 20px;border-top:1px solid var(--line);font-size:13px}
.tools button{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
#coords{display:none;margin-top:10px}
#coords.on{display:block}
#coords textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
#coords p{margin:0 0 6px;color:var(--muted)}

.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:#dfe5ec}
.leaflet-container{font-family:var(--font-body)}
.pin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--font-head);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer;transition:transform .12s}
.pin:hover,.pin.sel{transform:scale(1.18)}
.pin.sel{box-shadow:0 0 0 4px rgba(20,33,61,.35),0 2px 6px rgba(0,0,0,.45)}

.card{position:absolute;z-index:800;left:16px;bottom:16px;width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);color:var(--fg);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.28);border-top:6px solid var(--cat,var(--c-detencion))}
.card[hidden]{display:none}
.card .in{padding:16px 18px 18px}
.card .tag{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card h2{font:700 24px/1.15 var(--font-head);margin:8px 28px 10px 0;text-wrap:balance}
.card dl{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card p{margin:0 0 10px}
.card .pend{color:var(--muted);font-style:italic}
.card a{color:var(--fg);font-weight:500}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer}
.x:hover{background:color-mix(in srgb,var(--fg) 10%,transparent)}
.credit{position:absolute;z-index:700;right:8px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 46vh}
  .mapwrap{order:1}
  aside{order:2;border-right:0;border-top:1px solid var(--line)}
  .head{padding:12px 16px 8px}
  .head h1{font-size:24px}
  .head p{display:none}
  .filters{padding:8px 16px}
  .item{padding:8px 16px}
  .group{padding:10px 16px 2px}
  .tools{padding:8px 16px}
  .card{left:8px;right:8px;bottom:8px;width:auto;max-height:70%}
}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="head">
      <h1>Circuito de Memoria, Ciudad de Artigas</h1>
      <p>Nueve sitios vinculados a la dictadura cívico-militar: lugares de detención y tortura, espacios de resistencia y homenajes. Tocá un número en el mapa o en la lista.</p>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filtrar por categoría"></div>
    <div class="list" id="list"></div>
    <div class="tools">
      <button id="calBtn" aria-pressed="false">Ajustar ubicaciones</button>
      <div id="coords">
        <p>Arrastrá los números hasta el punto exacto. Copiá este texto y pegalo en <code>COORDS</code>.</p>
        <textarea id="coordsOut" readonly aria-label="Coordenadas ajustadas"></textarea>
        <button id="copyBtn" style="margin-top:6px">Copiar</button>
      </div>
    </div>
  </aside>
  <div class="mapwrap">
    <div id="map" role="application" aria-label="Mapa de la ciudad de Artigas con los sitios del circuito"></div>
    <div class="credit">Desde 2012</div>
    <article class="card" id="card" hidden aria-live="polite"></article>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  /* ---------- Datos ---------- */
  var CATS = {
    detencion:  {nombre:"Centros y lugares de detención, tortura y cárceles", corto:"Detención y tortura", color:"var(--c-detencion)", k:"k-detencion"},
    resistencia:{nombre:"Lugares de resistencia", corto:"Resistencia", color:"var(--c-resistencia)", k:"k-resistencia"},
    homenaje:   {nombre:"Homenajes (placas ya existentes integradas al circuito)", corto:"Homenajes", color:"var(--c-homenaje)", k:"k-homenaje"}
  };

  /* Coordenadas [lat, lng]. SON APROXIMADAS: verificá cada una con "Ajustar ubicaciones"
     y pegá el resultado en este objeto. */
  var COORDS = {
    1:[-30.39810,-56.46309], /* verificado con Google Maps */
    2:[-30.4128,-56.4888], /* confirmado por el autor */
    3:[-30.43197,-56.51529], /* verificado con Google Maps (Expo-Rural Chiflero) */
    4:[-30.40226,-56.46575], /* verificado con Google Maps (Farmacia Pollini, ex Hogar Femenino) */
    5:[-30.40414,-56.46777], /* verificado con Google Maps (Berreta 536) */
    6:[-30.40303,-56.46990], /* verificado con Google Maps (Iglesia Sagrado Corazón de Jesús) */
    7:[-30.39854,-56.46476], /* verificado con Google Maps (Garzón 212) */
    8:[-30.40442,-56.46861], /* verificado con Google Maps (Plaza José Batlle y Ordóñez) */
    9:[-30.40448,-56.46850]  /* mismo lugar que el 8, separado ~10 m para que se vean ambos números */
  };

  var SITIOS = [
    {id:1, cat:"detencion", nombre:"Edificio Gral. Eugenio Garzón (Jefatura de Policía, Seccional 1ª y ex Batallón de Infantería Nº 9)",
     dir:"Amaro F. Ramos 289", hoy:"Funcionan allí la Jefatura de Policía, la Seccional 1ª y la Oficina de Migración.", historia:""},
    {id:2, cat:"detencion", nombre:"Regimiento Guayabos de Caballería Mecanizada Nº 10 (El Pedregal)",
     dir:"Telmo García Da Rosa s/n", hoy:"Ex Batallón de Infantería Nº 9.", historia:""},
    {id:3, cat:"detencion", nombre:"Local de Exposiciones y Remates de la Asociación Agropecuaria (Local Chiflero)",
     dir:"Ruta 30, zona suroeste de la ciudad", hoy:"Continúa en funcionamiento como local de la Asociación Agropecuaria.",
     historia:"Fue utilizado como lugar clandestino de detención y tortura."},
    {id:4, cat:"detencion", nombre:"Ex Hogar Femenino del Consejo del Niño",
     dir:"Presidente Tomás Berreta 400, esq. Lavalleja", hoy:"Actualmente funciona allí la Farmacia Pollini. La señalización se instalará en la vereda.", historia:""},
    {id:5, cat:"resistencia", nombre:"Local sindical de AEBU",
     dir:"Presidente Berreta 536", hoy:"Sede donde sesiona la Comisión Pro Sitio, en la Sala Avelino Cordero.", historia:""},
    {id:6, cat:"resistencia", nombre:"Parroquia Sagrado Corazón de Jesús y Casa Parroquial",
     dir:"Gral. Eugenio Garzón", hoy:"Señalización a instalar en la vereda.", historia:""},
    {id:7, cat:"resistencia", nombre:"Ex Casa de la Familia Ayala Favale",
     dir:"Gral. Eugenio Garzón 212", hoy:"Señalización a instalar en la vereda.", historia:""},
    {id:8, cat:"homenaje", nombre:"Placa de homenaje a Héctor Daniel Brum Cornelius",
     dir:"Plaza Batlle y Ordóñez (Carlos Lecueder, Gral. Eugenio Garzón, Presidente Tomás Berreta, José Pedro Varela y Treinta y Tres Orientales)",
     hoy:"Placa ya instalada.", historia:""},
    {id:9, cat:"homenaje", nombre:"Placa de homenaje a María de los Ángeles (Marisa) Corbo",
     dir:"Plaza Batlle y Ordóñez", hoy:"Placa ya instalada.", historia:""}
  ];

  /* ---------- Mapa ---------- */
  var map = L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([-30.4025,-56.4700],15);
  var osm = L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",{
    subdomains:"abc",
    maxZoom:20,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles OSM France'
  }).addTo(map);
  var calles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{
    maxZoom:19,
    attribution:'Tiles &copy; Esri'
  });
  var satelite = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
    maxZoom:19,
    attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics'
  });
  L.control.layers({"Calles (OSM)":osm,"Calles (Esri)":calles,"Satélite":satelite},null,{position:"topright",collapsed:false}).addTo(map);

  var markers = {}, visible = {detencion:true,resistencia:true,homenaje:true}, selected = null, cal = false;

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  SITIOS.forEach(function(s){
    var icon = L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,17],
      html:'<div class="pin '+CATS[s.cat].k+'" data-id="'+s.id+'">'+s.id+'</div>'});
    var m = L.marker(COORDS[s.id],{icon:icon,keyboard:true,title:s.id+". "+s.nombre,alt:s.id+". "+s.nombre}).addTo(map);
    m.on("click",function(){select(s.id,false)});
    m.on("dragend",function(){var p=m.getLatLng();COORDS[s.id]=[+p.lat.toFixed(5),+p.lng.toFixed(5)];renderCoords();if(selected===s.id)showCard(s)});
    markers[s.id]=m;
  });

  function fit(){
    var pts=SITIOS.filter(function(s){return visible[s.cat]}).map(function(s){return COORDS[s.id]});
    if(pts.length) map.fitBounds(pts,{padding:[60,60],maxZoom:16});
  }
  fit();

  /* ---------- Lista y filtros ---------- */
  var filters=document.getElementById("filters"), list=document.getElementById("list");
  Object.keys(CATS).forEach(function(k){
    var b=document.createElement("button");
    b.className="chip";b.setAttribute("aria-pressed","true");
    b.innerHTML='<i style="background:'+CATS[k].color+'"></i>'+esc(CATS[k].corto);
    b.onclick=function(){
      visible[k]=!visible[k];b.setAttribute("aria-pressed",String(visible[k]));
      SITIOS.forEach(function(s){if(s.cat===k){visible[k]?markers[s.id].addTo(map):map.removeLayer(markers[s.id])}});
      renderList();
      if(selected && !visible[SITIOS[selected-1].cat]) closeCard();
    };
    filters.appendChild(b);
  });

  function renderList(){
    list.innerHTML="";
    Object.keys(CATS).forEach(function(k){
      if(!visible[k]) return;
      var g=document.createElement("div");g.className="group";g.textContent=CATS[k].nombre;list.appendChild(g);
      SITIOS.filter(function(s){return s.cat===k}).forEach(function(s){
        var b=document.createElement("button");b.className="item";b.dataset.id=s.id;
        if(selected===s.id)b.setAttribute("aria-current","true");
        b.innerHTML='<span class="num '+CATS[k].k+'">'+s.id+'</span><span><b>'+esc(s.nombre)+'</b><small>'+esc(s.dir)+'</small></span>';
        b.onclick=function(){select(s.id,true)};
        list.appendChild(b);
      });
    });
  }
  renderList();

  /* ---------- Ficha ---------- */
  var card=document.getElementById("card");
  function showCard(s){
    var c=CATS[s.cat], p=COORDS[s.id];
    var osm="https://www.openstreetmap.org/?mlat="+p[0]+"&mlon="+p[1]+"#map=18/"+p[0]+"/"+p[1];
    var gm="https://www.google.com/maps/dir/?api=1&destination="+p[0]+","+p[1];
    card.style.setProperty("--cat",c.color);
    card.innerHTML=
      '<button class="x" aria-label="Cerrar ficha">&times;</button><div class="in">'+
      '<span class="tag"><span class="num '+c.k+'" style="width:24px;height:24px;font-size:13px">'+s.id+'</span>'+esc(c.corto)+'</span>'+
      '<h2>'+esc(s.nombre)+'</h2>'+
      '<dl><dt>Dirección</dt><dd>'+esc(s.dir)+'</dd><dt>Hoy</dt><dd>'+esc(s.hoy)+'</dd></dl>'+
      (s.historia?'<p>'+esc(s.historia)+'</p>':'<p class="pend">Texto histórico pendiente de completar.</p>')+
      '<a href="'+gm+'" target="_blank" rel="noopener">Cómo llegar</a> · <a href="'+osm+'" target="_blank" rel="noopener">Ver en OpenStreetMap</a>'+
      (cal?'<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><label for="pasteIn" style="display:block;font-size:13px;color:var(--muted)">Pegá las coordenadas de Google Maps (ej. -30.40123, -56.46890)</label>'+
        '<div style="display:flex;gap:6px;margin-top:6px"><input id="pasteIn" style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)" placeholder="-30.40123, -56.46890">'+
        '<button id="pasteBtn" style="border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer">Mover</button></div></div>':'')+
      '</div>';
    card.hidden=false;
    card.querySelector(".x").onclick=closeCard;
    var pb=card.querySelector("#pasteBtn");
    if(pb) pb.onclick=function(){
      var n=card.querySelector("#pasteIn").value.match(/-?\d+(?:[.,]\d+)?/g);
      if(!n||n.length<2) return;
      var a=parseFloat(n[0].replace(",",".")), b=parseFloat(n[1].replace(",","."));
      COORDS[s.id]=[a,b];markers[s.id].setLatLng([a,b]);map.panTo([a,b]);renderCoords();showCard(s);
    };
  }
  function closeCard(){
    card.hidden=true;selected=null;
    document.querySelectorAll(".pin.sel").forEach(function(e){e.classList.remove("sel")});
    renderList();
  }
  function select(id,pan){
    var s=SITIOS[id-1];selected=id;
    document.querySelectorAll(".pin").forEach(function(e){e.classList.toggle("sel",+e.dataset.id===id)});
    showCard(s);renderList();
    if(pan) map.flyTo(COORDS[id],Math.max(map.getZoom(),17),{duration:.7});
  }
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!card.hidden)closeCard()});

  /* ---------- Ajuste de ubicaciones ---------- */
  var calBtn=document.getElementById("calBtn"), coordsBox=document.getElementById("coords"), out=document.getElementById("coordsOut");
  function renderCoords(){
    out.value="var COORDS = {\n"+SITIOS.map(function(s){return "  "+s.id+":["+COORDS[s.id][0]+","+COORDS[s.id][1]+"]"}).join(",\n")+"\n};";
  }
  calBtn.onclick=function(){
    cal=!cal;calBtn.setAttribute("aria-pressed",String(cal));coordsBox.classList.toggle("on",cal);
    SITIOS.forEach(function(s){cal?markers[s.id].dragging.enable():markers[s.id].dragging.disable()});
    renderCoords();
    if(selected) showCard(SITIOS[selected-1]);
  };
  document.getElementById("copyBtn").onclick=function(){
    try{navigator.clipboard.writeText(out.value)}catch(e){out.select()}
  };
  SITIOS.forEach(function(s){markers[s.id].dragging.disable()});
})();
</script>
</body>
</html>
